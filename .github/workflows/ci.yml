name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test protocol golden vectors and cross-runtime verification
        run: npm run test --workspace @incident-witness/protocol

      - name: Test API unit and JWT validation
        run: npm run test --workspace @incident-witness/api

      # Database integration tests require the approved staging secrets and
      # are run explicitly with `npm test` in the staging environment. They are
      # intentionally not wired to repository-wide CI credentials.
      - name: Build
        run: npm run build
