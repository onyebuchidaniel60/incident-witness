services:
  - type: web
    name: incident-witness-api
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace @incident-witness/protocol && npm run build --workspace @incident-witness/correlator && npm run build --workspace @incident-witness/db && npm run build --workspace @incident-witness/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
